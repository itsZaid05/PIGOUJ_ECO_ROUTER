[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pigouj"
version = "0.1.0"
description = "PIGOU-J v7 CPU contracts and explicitly synthetic replay demonstrations"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.4"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.14.4", "mypy==1.19.0", "hypothesis==6.148.0"]

[project.scripts]
pigouj-demo = "pigouj.harness:main"

[tool.setuptools.package-data]
pigouj = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
